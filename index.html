<script>
// Multi-image slides carousel
document.querySelectorAll('.slide[data-images]').forEach(function (slide) {
  var files = slide.dataset.images.split(',');
  var img = slide.querySelector('img');
  var i = 0;
  var nextBtn = slide.querySelector('.next');
  if (nextBtn) {
    nextBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      i = (i + 1) % files.length;
      img.src = files[i];
    });
  }
});

// Click on artwork to dismiss or toggle blur & details
document.querySelectorAll('.slide').forEach(function (slide) {
  slide.addEventListener('click', function (e) {
    if (e.target.closest('.next')) return; // Don't trigger on arrow button click

    // On mobile / touch devices: toggle .show-info
    if (window.matchMedia('(hover: none)').matches || e.pointerType === 'touch') {
      var wasOpen = slide.classList.contains('show-info');
      document.querySelectorAll('.slide.show-info').forEach(function (s) {
        s.classList.remove('show-info');
      });
      if (!wasOpen) {
        slide.classList.add('show-info');
      }
    } else {
      // On desktop: click toggles .hide-info to dismiss or re-show blur while hovering
      slide.classList.toggle('hide-info');
    }
  });

  // When mouse leaves the card, reset dismiss state so next hover works normally
  slide.addEventListener('mouseleave', function () {
    slide.classList.remove('hide-info');
  });
});

// Tap outside to dismiss on mobile
document.addEventListener('click', function (e) {
  if (!e.target.closest('.slide')) {
    document.querySelectorAll('.slide.show-info').forEach(function (s) {
      s.classList.remove('show-info');
    });
  }
});
</script>
